# slf4j-simple config for the desktop app's console output.
# Koog logs its own request/response chatter at DEBUG — keep it off by default so the app's own
# warnings and errors stay readable. Set org.slf4j.simpleLogger.defaultLogLevel=debug when
# diagnosing what Koog actually sent to Ollama.
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.levelInBrackets=true
